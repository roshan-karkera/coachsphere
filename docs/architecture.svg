<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>CoachSphere Architecture</title>
  <desc>Data pipeline from synthetic data source through SQLite, metrics layer, then branching to Streamlit dashboard, MCP server, and LangGraph agent.</desc>

  <rect width="780" height="620" fill="#f9f9f9" rx="12"/>

  <text x="390" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#111">CoachSphere — System Architecture</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#888">AI Sales Coaching Analytics Platform</text>

  <!-- Data Source -->
  <rect x="270" y="70" width="240" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Data Source</text>
  <text x="390" y="107" text-anchor="middle" font-size="10" fill="#2563eb">Python · Faker · NumPy — 44 users, 6 months</text>

  <line x1="390" y1="118" x2="390" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQLite DB -->
  <rect x="230" y="140" width="320" height="68" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="390" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#111">SQLite Database</text>
  <text x="390" y="177" text-anchor="middle" font-size="10" fill="#555">users · coaching_sessions · skill_assessments</text>
  <text x="390" y="193" text-anchor="middle" font-size="10" fill="#555">session_feedback · business_metrics · metric_definitions</text>

  <line x1="390" y1="208" x2="390" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metrics Layer -->
  <rect x="200" y="230" width="380" height="68" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="390" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">Metrics Layer — SQL Views</text>
  <text x="390" y="269" text-anchor="middle" font-size="10" fill="#7c3aed">v_coaching_effectiveness · v_team_summary · v_business_impact</text>
  <text x="390" y="285" text-anchor="middle" font-size="10" fill="#7c3aed">v_session_engagement · v_skill_progression · v_communication_quality</text>

  <line x1="280" y1="298" x2="140" y2="340" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="298" x2="390" y2="340" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="298" x2="640" y2="340" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Streamlit Dashboard -->
  <rect x="20" y="340" width="230" height="130" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="135" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Streamlit Dashboard</text>
  <text x="135" y="380" text-anchor="middle" font-size="10" fill="#16a34a">Overview KPIs</text>
  <text x="135" y="395" text-anchor="middle" font-size="10" fill="#16a34a">Team Analytics</text>
  <text x="135" y="410" text-anchor="middle" font-size="10" fill="#16a34a">Skill Progression</text>
  <text x="135" y="425" text-anchor="middle" font-size="10" fill="#16a34a">Rep Deep Dive</text>
  <text x="135" y="440" text-anchor="middle" font-size="10" fill="#16a34a">Metric Definitions</text>
  <text x="135" y="455" text-anchor="middle" font-size="10" fill="#16a34a">AI Assistant (Groq)</text>

  <!-- MCP Server -->
  <rect x="275" y="340" width="230" height="130" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="390" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">MCP Server (FastMCP)</text>
  <text x="390" y="380" text-anchor="middle" font-size="10" fill="#ea580c">10 analytics tools</text>
  <text x="390" y="395" text-anchor="middle" font-size="10" fill="#ea580c">SSE transport (Render)</text>
  <text x="390" y="410" text-anchor="middle" font-size="10" fill="#ea580c">coachsphere-mcp.onrender.com</text>
  <text x="390" y="430" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">Clients:</text>
  <text x="390" y="447" text-anchor="middle" font-size="10" fill="#ea580c">Claude Desktop</text>
  <text x="390" y="463" text-anchor="middle" font-size="10" fill="#ea580c">Any MCP-compatible client</text>

  <!-- LangGraph Agent -->
  <rect x="530" y="340" width="230" height="130" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="694" y="334" width="36" height="16" rx="4" fill="#ef4444"/>
  <text x="712" y="346" text-anchor="middle" font-size="9" font-weight="700" fill="white">NEW</text>
  <text x="645" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">LangGraph Agent</text>
  <text x="645" y="380" text-anchor="middle" font-size="10" fill="#dc2626">ReAct loop (tool-calling)</text>
  <text x="645" y="395" text-anchor="middle" font-size="10" fill="#dc2626">Groq · llama-3.3-70b</text>
  <text x="645" y="410" text-anchor="middle" font-size="10" fill="#dc2626">10 LangChain tools</text>
  <text x="645" y="430" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">Interfaces:</text>
  <text x="645" y="447" text-anchor="middle" font-size="10" fill="#dc2626">Python API · CLI runner</text>
  <text x="645" y="463" text-anchor="middle" font-size="10" fill="#dc2626">Multi-step chaining</text>

  <line x1="645" y1="470" x2="645" y2="500" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Groq box -->
  <rect x="535" y="500" width="220" height="44" rx="8" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="645" y="519" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Groq Cloud API</text>
  <text x="645" y="535" text-anchor="middle" font-size="10" fill="#ef4444">Llama 3.3 70B Versatile · temp 0</text>

  <!-- Shared note -->
  <rect x="230" y="500" width="280" height="36" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="370" y="514" text-anchor="middle" font-size="10" fill="#888">Both MCP server and LangGraph agent</text>
  <text x="370" y="528" text-anchor="middle" font-size="10" fill="#888">share the same 10 SQL query functions</text>

  <!-- Legend -->
  <rect x="20" y="555" width="740" height="50" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="573" font-size="10" font-weight="600" fill="#555">Layers:</text>
  <rect x="90" y="562" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="107" y="573" font-size="10" fill="#555">Generation</text>
  <rect x="178" y="562" width="12" height="12" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="195" y="573" font-size="10" fill="#555">Storage</text>
  <rect x="250" y="562" width="12" height="12" rx="2" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="267" y="573" font-size="10" fill="#555">Metrics</text>
  <rect x="325" y="562" width="12" height="12" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="342" y="573" font-size="10" fill="#555">Dashboard</text>
  <rect x="408" y="562" width="12" height="12" rx="2" fill="#ffedd5" stroke="#f97316" stroke-width="1"/>
  <text x="425" y="573" font-size="10" fill="#555">MCP</text>
  <rect x="462" y="562" width="12" height="12" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="479" y="573" font-size="10" fill="#555">Agent (new)</text>
  <text x="390" y="595" text-anchor="middle" font-size="10" fill="#888">SQLite DB · Jan-Jun 2024 · 44 users · 2,437 sessions · 240 business metric records</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaa"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fca5a5"/>
    </marker>
  </defs>
</svg>
